name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs twice daily at 04:00 and 16:00 UTC to ensure Supabase never enters inactive state
    - cron: '0 4,16 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Innocentia Keep-Alive Endpoint
        run: |
          echo "Sending keep-alive ping to Innocentia API & Supabase..."
          curl -s -S -X GET "https://innocentia.tech/api/cron/keepalive"
          echo ""
          curl -s -S -X GET "https://ckqbxgntxpalwanfkusq.supabase.co/auth/v1/health" || true
          echo ""
          echo "Keep-alive ping completed successfully."
